name: Release
# `v*`のtagをpushすると、testを通してから4つのplatformのbinaryを作り、GitHub Releaseに置く。
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: test
        run: mise exec -- go test ./...
      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=${TAG#v}
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}
            arch=${target#*/}
            name="slotctl_${version}_${os}_${arch}"
            mkdir "build-$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch mise exec -- go build -trimpath -ldflags='-s -w' -o "build-$name/slotctl" ./cmd/slotctl
            cp LICENSE README.md "build-$name/"
            tar -C "build-$name" -czf "dist/$name.tar.gz" slotctl LICENSE README.md
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
